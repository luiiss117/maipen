<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delete Machine</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: #07090c;
        color: #e5e7eb;
        font-family: "Segoe UI", Arial, sans-serif;
    }

    .card {
        width: min(430px, 100%);
        padding: 30px;
        border: 1px solid #30343b;
        border-radius: 10px;
        background: #0d1117;
        text-align: center;
    }

    .icon {
        font-size: 42px;
        margin-bottom: 15px;
    }

    h1 {
        margin: 0 0 12px;
        color: #f87171;
        font-family: Consolas, monospace;
        font-size: 25px;
    }

    p {
        margin: 0 0 20px;
        color: #9ca3af;
        line-height: 1.6;
    }

    .warning {
        margin-bottom: 25px;
        padding: 13px;
        border: 1px solid #63252b;
        border-radius: 7px;
        background: #180b0d;
        color: #fca5a5;
        font-family: Consolas, monospace;
        font-size: 13px;
    }

    .buttons {
        display: flex;
        gap: 10px;
    }

    button {
        flex: 1;
        padding: 12px;
        border: 0;
        border-radius: 7px;
        color: white;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
    }

    .delete {
        background: #dc2626;
    }

    .delete:hover {
        background: #b91c1c;
    }

    .cancel {
        background: #252b33;
    }

    .cancel:hover {
        background: #343b45;
    }
</style>

</head> <body> <div class="card">
<div class="icon">🖥️⚠️</div>

<h1>Delete Machine?</h1>

<p>
    You are about to remove this machine
    from your inventory.
</p>

<div class="warning">
    All services and information linked to this machine will be deleted.
</div>

<form method="post">

    <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
    >

    <div class="buttons">

        <button
            class="delete"
            type="submit"
            name="confirmation"
            value="Yes"
        >
            Delete Machine
        </button>

        <button
            class="cancel"
            type="submit"
            name="confirmation"
            value="No"
        >
            Cancel
        </button>

    </div>

</form>

</div> </body> </html>
