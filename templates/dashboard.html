<!DOCTYPE html>
<html>
<body>
    {% with messages = get_flashed_messages()%}
    {% if messages%}
    {% for message in messages%}
    <p>{{message}}</p>
    {%endfor%}
    {%endif%}
    {%endwith%}
	<h1>Dashboard</h1>
    {% if username %}
    	<h3> Welcome {{ username }} </h3>
    {% endif %}
    <a href="{{url_for('auth.logout')}}">Logout</a>
</body>
</html>
