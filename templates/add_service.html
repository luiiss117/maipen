<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Add Service</title> <style> * { box-sizing:border-box; font-family:"Segoe UI", Arial, sans-serif; } body { margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center; background: radial-gradient( circle at top left, #2563eb, transparent 35% ), linear-gradient( 135deg, #020617, #0f172a, #172554 ); color:white; } .form-container { width:420px; padding:40px; border-radius:20px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); backdrop-filter:blur(15px); box-shadow: 0 20px 50px rgba(0,0,0,0.4); } h2 { text-align:center; color:#38bdf8; font-size:32px; margin-bottom:30px; } .flash { background:#1e40af; padding:12px; border-radius:10px; margin-bottom:15px; } .error { color:#fecaca; background:#991b1b; padding:8px; border-radius:8px; margin-bottom:10px; display:block; } .form-group { margin-bottom:20px; } label { display:block; margin-bottom:8px; color:#cbd5e1; font-weight:600; } input, textarea, select { width:100%; padding:12px; border-radius:10px; border:1px solid #475569; background:#0f172a; color:white; font-size:15px; outline:none; } input:focus, textarea:focus, select:focus { border-color:#38bdf8; box-shadow: 0 0 0 3px rgba(56,189,248,0.2); } textarea { resize:vertical; height:90px; } button { width:100%; padding:14px; margin-top:10px; border:none; border-radius:10px; background:#16a34a; color:white; font-size:16px; font-weight:bold; cursor:pointer; } button:hover { background:#15803d; } .return { display:block; text-align:center; margin-top:20px; color:#38bdf8; text-decoration:none; font-weight:600; } .return:hover { text-decoration:underline; } </style> </head> <body> <div class="form-container"> <h2> ⚙ Add New Service </h2>

{% with messages = get_flashed_messages() %}

{% if messages %}

{% for message in messages %}

<div class="flash"> {{ message }} </div>

{% endfor %}

{% endif %}

{% endwith %}

<form method="post"> <div class="form-group"> <label for="protocol"> Network Protocol </label> <select name="protocol" id="protocol"> <option value="TCP"> TCP </option> <option value="UDP"> UDP </option> <option value="TCP&UDP"> TCP and UDP </option> </select> </div> <div class="form-group"> <label for="port"> Port Number </label>

{% if error %}

<div class="error"> {{ error }} </div>

{% endif %}

<input

type="number"

id="port"

name="port"

required

placeholder="Example: 22"

min="1"

max="65535"

</div> <div class="form-group"> <label for="name"> Service Name </label>

<input

type="text"

id="name"

name="name"

required

placeholder="Example: OpenSSH, Redis, PostgreSQL"

</div> <div class="form-group"> <label for="version"> Service Version (Optional) </label> <textarea id="version" name="version" placeholder="Example: 5.16" ></textarea> </div> <button type="submit">

Save Service

</button>

{% set machine_uuid = request.args.get("m") %}

<a class="return"

href="{{ url_for('machines.machine_info', machine_uuid=machine_uuid) }}">

← Return to Machine

</a> </form> </div> </body> </html>
