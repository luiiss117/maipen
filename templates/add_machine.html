<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Register Machine</title>
<style>
    :root {
        --bg: #050608;
        --panel: #0b0e12;
        --border: #1b2028;
        --red: #ff3b30;
        --green: #39d98a;
        --text: #e7e9ec;
        --muted: #737b87;
        --mono: Consolas, "SFMono-Regular", monospace;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: var(--bg);
        color: var(--text);
        font-family: var(--mono);
    }

    .container {
        width: 100%;
        max-width: 450px;
        padding: 28px;
        border: 1px solid var(--border);
        background: var(--panel);
    }

    header {
        margin-bottom: 25px;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--border);
    }

    h1 {
        margin: 0;
        font-size: 22px;
    }

    h1::before {
        content: "> ";
        color: var(--red);
    }

    .subtitle {
        margin-top: 7px;
        color: var(--muted);
        font-size: 10px;
    }

    .status {
        margin-top: 12px;
        color: var(--green);
        font-size: 9px;
    }

    .status::before {
        content: "● ";
    }

    .error {
        margin-bottom: 18px;
        padding: 10px;
        border: 1px solid #5b252b;
        background: #160a0d;
        color: #ef9da3;
        font-size: 10px;
    }

    .form-group {
        margin-bottom: 17px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        color: #aeb5bf;
        font-size: 10px;
        font-weight: bold;
        text-transform: uppercase;
    }

    input,
    select,
    textarea {
        width: 100%;
        padding: 11px;
        border: 1px solid #252b33;
        border-radius: 0;
        outline: none;
        background: #07090c;
        color: var(--text);
        font: inherit;
        font-size: 11px;
    }

    input:focus,
    select:focus,
    textarea:focus {
        border-color: var(--red);
    }

    textarea {
        min-height: 90px;
        resize: vertical;
    }

    .hint {
        margin-top: 5px;
        color: #4d5560;
        font-size: 8px;
    }

    button {
        width: 100%;
        padding: 12px;
        border: 1px solid #76252c;
        border-radius: 0;
        background: #351015;
        color: white;
        font: inherit;
        font-size: 10px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #52161d;
        border-color: var(--red);
    }

    button::before {
        content: "[+] ";
        color: var(--red);
    }

    footer {
        margin-top: 20px;
        padding-top: 15px;
        border-top: 1px solid var(--border);
        color: #454c56;
        font-size: 8px;
        text-align: center;
    }

    @media (max-width: 500px) {
        .container {
            padding: 22px 18px;
        }
    }
</style>

</head> <body> <div class="container">
<header>
    <h1>Register Machine</h1>
    <div class="subtitle">Operator Console // Infrastructure</div>
    <div class="status">READY</div>
</header>

{% if error %}
    <div class="error">{{ error }}</div>
{% endif %}

<form method="post">

    <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
    >

    <div class="form-group">
        <label for="name">Machine Name</label>

        <input
            type="text"
            id="name"
            name="name"
            required
            autocomplete="off"
            placeholder="WEB-SRV-01"
        >
    </div>

    <div class="form-group">
        <label for="ip">IP Address</label>

        <input
            type="text"
            id="ip"
            name="ip"
            required
            placeholder="192.168.1.100"
        >
    </div>

    <div class="form-group">
        <label for="os">Operating System</label>

        <select id="os" name="os">
            <option value="Linux">Linux</option>
            <option value="Windows">Windows</option>
        </select>
    </div>

    <div class="form-group">
        <label for="description">Description</label>

        <textarea
            id="description"
            name="description"
            placeholder="Optional machine description..."
        ></textarea>
    </div>

    <button type="submit">
        Register Machine
    </button>

</form>

<footer>
    OPERATOR CONSOLE // AUTHORIZED USE ONLY
</footer>

</div> </body> </html>
