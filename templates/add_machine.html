<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New machine</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 400px;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; 
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>New machine</h2>
    <form method="post">
        <div class="form-group">
            <label for="name">Name of the machine</label>
	    {% if already_exists == True: %}
            <font color="#FF0000">This machine already exists.</font>
    	    {% endif %}

            <input type="text" id="name" name="name" required placeholder="E.g Web_Server_01">
        </div>

        <div class="form-group">
            <label for="ip">IP Address of the machine</label>
            {% if ip_error == True: %}
            <font color="#FF0000">Invalid IP address.</font>
    	    {% endif %}
	    <input type="text" id="ip" name="ip" required placeholder="E.g 192.168.1.100">
        </div>

        <div class="form-group">
            <label for="os">Operating system of the machine</label>
	    <select name="os" id="os">
		    <option value="Linux">Linux</option>
		    <option value="Windows">Windows</option>
	    </select>
        </div>

        <div class="form-group">
            <label for="description">Description (Optional)</label>
            <textarea id="description" name="description" placeholder="Add more details..."></textarea>
        </div>

        <button type="submit">Save new machine</button>
    </form>
</div>

</body>
</html>
