<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Machine</title>

<style>

* {
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
    radial-gradient(
        circle at top left,
        #2563eb,
        transparent 35%
    ),
    linear-gradient(
        135deg,
        #020617,
        #0f172a,
        #172554
    );

    color:white;
}


.form-container {

    width:430px;

    padding:40px;

    border-radius:20px;

    background:rgba(255,255,255,0.08);

    border:1px solid rgba(255,255,255,0.15);

    backdrop-filter:blur(15px);

    box-shadow:0 20px 50px rgba(0,0,0,0.4);

}


h2 {

    text-align:center;

    color:#38bdf8;

    font-size:32px;

    margin-bottom:30px;

}


.form-group {

    margin-bottom:20px;

}


label {

    display:block;

    margin-bottom:8px;

    color:#cbd5e1;

    font-weight:600;

}


input,
textarea,
select {

    width:100%;

    padding:12px;

    border-radius:10px;

    border:1px solid #475569;

    background:#0f172a;

    color:white;

    font-size:15px;

    outline:none;

}


input:focus,
textarea:focus,
select:focus {

    border-color:#38bdf8;

    box-shadow:
    0 0 0 3px rgba(56,189,248,0.2);

}


textarea {

    height:90px;

    resize:vertical;

}


.error {

    background:#991b1b;

    color:#fee2e2;

    padding:10px;

    border-radius:8px;

    margin-bottom:20px;

    font-size:14px;

}


button {

    width:100%;

    padding:14px;

    margin-top:10px;

    background:#16a34a;

    color:white;

    border:none;

    border-radius:10px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

}


button:hover {

    background:#15803d;

}

</style>

</head>


<body>

<div class="form-container">


<h2>
🖥️ Add New Machine
</h2>


<form method="post">


{% if error %}

<div class="error">
    {{ error }}
</div>

{% endif %}



<div class="form-group">

<label for="name">
    Machine Name
</label>


<input

type="text"

id="name"

name="name"

required

placeholder="Example: Web_Server_01">

</div>




<div class="form-group">

<label for="ip">
    IP Address
</label>


<input

type="text"

id="ip"

name="ip"

required

placeholder="Example: 192.168.1.100">

</div>




<div class="form-group">

<label for="os">
    Operating System
</label>


<select name="os" id="os">

<option value="Linux">
    Linux
</option>

<option value="Windows">
    Windows
</option>

</select>

</div>




<div class="form-group">

<label for="description">
    Description (Optional)
</label>


<textarea

id="description"

name="description"

placeholder="Add more details about this machine...">

</textarea>

</div>




<button type="submit">

Save Machine

</button>


</form>


</div>


</body>

</html>
